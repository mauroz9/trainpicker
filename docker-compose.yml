version: '3.8'

services:
  telegram_bot:
    build: .
    container_name: renfe_bot_app
    command: python main.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - renfe_database:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  renfe_scheduler:
    build: .
    container_name: renfe_bot_scheduler
    command: python scheduler.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - renfe_database:/app/data
    depends_on:
      - telegram_bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  renfe_database: